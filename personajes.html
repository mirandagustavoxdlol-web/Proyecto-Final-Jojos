<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trabajo final de diseño Multimedial</title>

  <link rel="stylesheet" href="style.css">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  
<header class="site-header">

    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">

            <a class="navbar-brand" href="index.html">
                JoJo’s Bizarre Adventure
            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#mainNav"
                    aria-controls="mainNav"
                    aria-expanded="false"
                    aria-label="Abrir menú">

                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNav">

                <div class="navbar-nav ms-auto">

                    <a class="nav-link" href="index.html">Inicio</a>

                    <a class="nav-link" href="resumen.html">Resumen</a>

                    <a class="nav-link" href="personajes.html">Personajes</a>

                    <a class="nav-link" href="stands.html">Stands</a>

                    <a class="nav-link" href="autor.html">Autor</a>

                </div>

            </div>
        </div>
    </nav>

</header>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>

    const paginaActual = window.location.pathname.split("/").pop();

    const enlaces = document.querySelectorAll(".navbar-nav .nav-link");

    enlaces.forEach(enlace => {

        const paginaEnlace = enlace.getAttribute("href");

        if (
            paginaActual === paginaEnlace ||
            (paginaActual === "" && paginaEnlace === "index.html")
        ) {

            enlace.classList.add("active");
            enlace.setAttribute("aria-current", "page");

        }

    });

</script>

</body>
</html>
